services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=15GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/node_alerts.yml:/etc/prometheus/node_alerts.yml:ro
      - ./data/prometheus:/prometheus:rw
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:9090/-/ready
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring_net

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ./data/alertmanager:/alertmanager:rw
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:9093/-/ready
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring_net

  impulse:
    image: haideralimazari/impulse-custom:multistage
    container_name: impulse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      CONFIG_PATH: /config
      DATA_PATH: /data
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./impulse/config:/config:ro
      - ./data/impulse:/data:rw
      - ./impulse/templates:/app/templates
    depends_on:
      - alertmanager
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:5000/readyz")
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:13.2.0-slim
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ENABLE_GZIP: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge